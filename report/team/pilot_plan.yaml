# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Số D1 tính bằng src/lab13.py (hàm co_mau, z chính xác 1,95996 và 0,84162).
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75)).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa < c ÷ ICC = 20 ÷ 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 6 ÷ 0,02 = 300: không đạt, và chỉ 6 cụm (dưới 20).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m ÷ (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng 12 depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên đối chứng xem gợi ý của đồng nghiệp cùng depot; giảm bằng quyền truy cập trợ lý theo tài khoản và log staff_id ở mỗi lần chạy agent.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên, không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chọn chia theo nhân viên 20 + 20 và hạ mức chênh phát hiện được xuống 6 điểm (mde 0,06, cần m ≥ 299 yêu cầu mỗi người).
#   Con số bất lợi: nếu tác động thật chỉ là 5 điểm thì power chỉ còn 0,64 (NormalIndPower, n = 859). Giám đốc vận hành phải ký chấp nhận trước ngày bắt đầu.
#   Thời gian đo: trong phạm vi noi_dia + hang_nang mỗi nhân viên nhận khoảng 30,7 yêu cầu/ngày (1.500 × 81,8% ÷ 40), nên cần khoảng 10 ngày làm việc để đạt 299 yêu cầu mỗi người.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200) trên toàn mẫu, 3,97% (39/982) trong phạm vi noi_dia + hang_nang.
#   Ngưỡng tuyệt đối 3% sẽ làm pilot dừng ngay tuần đầu, nên nhóm so với nhóm đối chứng (chênh từ 2 điểm trở lên) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ yêu cầu noi_dia và hang_nang (chi phí mỗi việc thành công 0,22× và 0,69× so với 12.000 đ, simulated) của 40 nhân viên CSKH ở cả 12 depot; loại quoc_te (1,88×, simulated; thành công 27,3%; tỉ lệ ok lần 1, 2, 3 là 30,0%, 11,4%, 2,2% nên chạy lại không giúp) và doi_tac (0,85×, simulated; thành công 54,4%; có điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên dùng trợ lý, mỗi bước một tuần; chỉ đo chỉ số chính ở bước 0.50, kéo dài 2 tuần để đạt m ≥ 299
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng tự làm cùng tuần, cùng 12 depot, bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng quyền truy cập trợ lý theo tài khoản, log staff_id ở mỗi lần chạy agent, và theo dõi số lần chạy agent gắn với staff_id của nhóm đối chứng (ngưỡng 0)"
    predeclared: "Có: chỉ số chính, mde 0,06, alpha 0,05, bốn luật dừng và ngày quyết định 2027-01-15 chốt trong file này trước ngày bắt đầu 2026-12-07"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt 6%, hoặc có từ 1 ca hoàn tiền trùng trở lên TRONG 3 ngày liên tiếp theo dõi hằng ngày THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Backend Engineer rà toàn bộ trace của các ca đó trong 24 giờ KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công của nhóm trợ lý vượt 8.000 đ (0,67× của 12.000 đ, simulated) hoặc tỉ lệ làm lại vượt 7% (đợt chạy thử 4,9% trong phạm vi) TRONG 2 tuần liên tiếp THÌ Product Manager thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong phạm vi pilot"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên số được xem lại) vượt 40% (đợt chạy thử 27,12%) TRONG 1 tuần THÌ CSKH Lead phỏng vấn 5 nhân viên nhóm trợ lý và rà 20 trace bị bỏ trong 3 ngày làm việc KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU thời gian xem lại trung bình mỗi yêu cầu vượt 5,1 phút (ngưỡng hoà vốn khi xem lại 100%; 4,8 phút nếu làm lại 15,3 phút như dữ liệu, simulated) TRONG 1 tuần THÌ CSKH Lead đổi sang xem lại theo mẫu rủi ro và báo Product Manager KHÔNG THÌ không được mở rộng số nhân viên dùng trợ lý"
  interim_looks: "chỉ kiểm tra chỉ số an toàn: tỉ lệ mở lại trong 7 ngày và tỉ lệ hoàn tiền trùng xem hằng ngày; chỉ số chính chỉ đọc một lần vào ngày quyết định, không đọc giữa chừng"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; mọi yêu cầu mới quay về luồng nhân viên tự làm (6 phút, 12.000 đ mỗi yêu cầu), yêu cầu đang chạy dở được chuyển nhân viên kèm tóm tắt"
  decision_date: "2027-01-15"     # bước 0.50 đo 2026-12-21 → 2027-01-08, cộng 7 ngày theo dõi mở lại
  simulated_inputs:
